[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "main.py", "app.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"scripts/viewer_smoke.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py", "scripts/check.py"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "numpy.*", "cv2.*", "PIL.*", "matplotlib.*", "yaml.*"]
follow_imports = "skip"
