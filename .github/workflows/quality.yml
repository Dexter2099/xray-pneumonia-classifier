name: Python quality
on:
  pull_request:
  push:
    branches: [main, codex/xray-core, codex/xray-viewer]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install legacy demo dependencies
        run: python -m pip install streamlit pandas playwright imageio-ffmpeg
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check core types
        run: python -m mypy
      - name: Test with synthetic checkpoints
        run: python -m pytest -q
      - name: Audit resolved application dependencies
        run: python -m pip_audit -r requirements-viewer.txt
